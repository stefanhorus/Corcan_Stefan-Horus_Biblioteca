// Protos/ratings.proto (în Biblioteca, GrpcServices="Server"; în portal, GrpcServices="Client")
syntax = "proto3";

option csharp_namespace = "BibliotecaGrpc";

package biblioteca;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ReaderRatings {
  rpc ListRatings (ReaderRequest) returns (stream RatingItem);   // server streaming
  rpc GetRating (RatingId) returns (RatingItem);
  rpc AddRating (NewRating) returns (RatingItem);
  rpc UpdateRating (UpdateRatingRequest) returns (RatingItem);
  rpc DeleteRating (RatingId) returns (google.protobuf.Empty);
}

message ReaderRequest { int32 reader_id = 1; }

message RatingId { int32 id = 1; }

message RatingItem {
  int32 id = 1;
  int32 book_id = 2;
  string title = 3;
  int32 stars = 4;
  google.protobuf.Timestamp created_at = 5;
}

message NewRating {
  int32 reader_id = 1;
  int32 book_id = 2;
  int32 stars = 3;
}

message UpdateRatingRequest {
  int32 id = 1;
  int32 stars = 2;
}
